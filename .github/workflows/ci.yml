name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Важно: тесты должны идти не в UTC, иначе баги с часовыми поясами не видны.
  TZ: Europe/Moscow

jobs:
  checks:
    name: Типы, тесты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Тесты (включая прогон интерфейса в jsdom)
        run: npm test

      - name: Сборка рендерера и main-процесса
        run: |
          npm run build:renderer
          npm run build:electron


  package-windows:
    name: Проверка упаковки Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Проверить тесты на Windows
        run: npm test
      - name: Собрать приложение
        run: |
          npm run build:renderer
          npm run build:electron
      - name: Упаковать приложение Windows (без установщика)
        run: npx electron-builder --win --dir --publish never
