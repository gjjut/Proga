name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Типы, тесты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Тесты (включая прогон интерфейса в jsdom)
        run: npm test

      - name: Сборка рендерера и main-процесса
        run: |
          npm run build:renderer
          npm run build:electron

